name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @answer-checker/web

  action:
    # Runs this repo's own GitHub Action on the six playground samples.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: checks
        uses: ./
        with:
          config: examples/handbook/checks.yml
          receipts: ${{ runner.temp }}/receipts
      - run: echo "${{ steps.checks.outputs.passed }} of ${{ steps.checks.outputs.total }} as expected"
