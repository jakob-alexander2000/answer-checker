name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @answer-checker/web
      - name: Bench results are current
        run: |
          npm run bench --workspace @answer-checker/bench
          git diff --exit-code bench/

  action:
    # Runs this repo's own GitHub Action on the six playground samples.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: checks
        uses: ./
        with:
          config: examples/handbook/checks.yml
          receipts: ${{ runner.temp }}/receipts
      - run: echo "${{ steps.checks.outputs.passed }} of ${{ steps.checks.outputs.total }} as expected"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t answer-checker:ci .
      - name: Health, playground and one check
        run: |
          docker run -d --name ac -p 8787:8787 answer-checker:ci
          for i in $(seq 1 30); do curl -sf localhost:8787/health && break; sleep 1; done
          curl -sf localhost:8787/ -o /dev/null
          curl -sf localhost:8787/v1/check -H 'content-type: application/json' \
            -d '{"question":"Q?","answer":"Employees receive 30 days.","sources":["Full-time employees receive 30 days after the probation period."]}' \
            | grep -q '"verdict":"fail"'
