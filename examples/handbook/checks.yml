# The six playground samples as a test suite. Each faithful answer must pass,
# each drifted one must fail the check named in expect_failed.
# Synthetic handbooks, not real policies.
name: handbook-samples
cases:
  - id: leave-faithful
    question: How many days of annual leave do employees get?
    sources:
      - Annual leave. In practice, full-time employees only receive 30 days of paid annual leave after the probation period. Part-time staff receive a share that matches their contracted hours. Days are booked in the planning tool at least 10 working days ahead. A manager may refuse a date when the team cannot cover the work, and the refusal is a sentence in the tool, not a shrug. Unused days, up to 5, may be carried into the next calendar year and must be taken by the end of March. Days above 5 are lost. The atelier closes from 27 December through 31 December, and those closure days come out of the 30 days. A person who joins in the second half of the year receives a pro-rated share of the remaining year, still only after probation has ended. Booking a day and then not taking it, without telling the manager, counts as a missed day and is talked about in the next one-to-one.
    answer: Full-time employees only receive 30 days of paid annual leave after the probation period.
  - id: leave-drifted
    question: How many days of annual leave do employees get?
    sources:
      - Annual leave. In practice, full-time employees only receive 30 days of paid annual leave after the probation period. Part-time staff receive a share that matches their contracted hours. Days are booked in the planning tool at least 10 working days ahead. A manager may refuse a date when the team cannot cover the work, and the refusal is a sentence in the tool, not a shrug. Unused days, up to 5, may be carried into the next calendar year and must be taken by the end of March. Days above 5 are lost. The atelier closes from 27 December through 31 December, and those closure days come out of the 30 days. A person who joins in the second half of the year receives a pro-rated share of the remaining year, still only after probation has ended. Booking a day and then not taking it, without telling the manager, counts as a missed day and is talked about in the next one-to-one.
