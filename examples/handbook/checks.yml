  - id: telework-faithful
    question: May I work from home for 2 days a week?
    sources:
      - Telework. Staff may telework from their registered home address for up to 2 days each week, unless they are in the probation period. The days are agreed with the manager for the week ahead, on the Friday before. Client-site roles are not eligible for telework. The home address is the one on the personal file. Working from a cafe, a train, or another country is outside this rule. The atelier may ask for those days to be spent on site in a week when a client visit or a workshop needs the whole team, and the ask is made by Wednesday where that is possible. Kit used at home is the same kit as on site, and it comes back on the last day. A person who moves house updates the file before the next telework day. The day still has the same hours and the same availability on the team channel.
    answer: Staff may telework from their registered home address for up to 2 days each week, unless they are in the probation period.
