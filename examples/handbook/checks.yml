  - id: everyone-faithful
    question: Does every worker get these benefits?
    sources:
      - Who this text is for. This handbook applies only to people employed by Linden Atelier who work in Germany. It does not apply to contractors, agency workers, or staff of other group companies. Not every worker gets these benefits. A person who works in another country, or for another organisation, cannot use these pages to claim anything. Later sections say "staff" for that same narrow group, unless a sentence narrows the group again. A change of workplace country, even for a month, takes the person outside this text until they are back. Questions about the boundary go to the people team, and a guess by a manager is not enough to widen it.
    answer: This handbook applies only to people employed by Linden Atelier who work in Germany.
